# Scheduled jobs. Deploy separately from the app:
#
#   gcloud app deploy cron.yaml
#
# App Engine calls these URLs on the schedule below with an
# X-Appengine-Cron: true header, which it strips from any request arriving
# from outside — that header is what authenticates them, so the matching
# check in server.ts must stay pinned to the /api/cron/ prefix.

cron:
  - description: >-
      Export the whole database to Cloud Storage. This is the backup that
      survives losing the project; the staging copy does not, because it lives
      inside it. Nightly, because a day is roughly how much work the firm can
      stand to redo.
    url: /api/cron/firestore-export
    schedule: every day 03:00
    timezone: America/Chicago

  - description: >-
      Snapshot every investor's portfolio and report what changed. Monthly,
      because portfolios move on the timescale of funding announcements and a
      daily run would mostly record that nothing happened.
    url: /api/cron/portfolio-snapshot
    schedule: 1 of month 06:00
    timezone: America/Chicago

  - description: >-
      Re-read the websites of companies we are actively tracking and report
      what changed on them.
    url: /api/cron/site-diff
    schedule: every monday 06:30
    timezone: America/Chicago

  - description: >-
      Check where the founders and firm contacts in our graph currently work.
      Runs weekly and takes a slice each time rather than the whole list, so
      the cost is bounded and predictable.
    url: /api/cron/people-watch
    schedule: every wednesday 06:30
    timezone: America/Chicago

  - description: >-
      Work through the investor repository: who works at each firm, and who
      each firm invests alongside. Four runs rather than one, because App
      Engine kills a request at ten minutes and each fresh window picks up
      where the last left off. Running more often cannot cost more: the job
      stops itself at the month's free grounding allowance, so a busier
      schedule finishes the month's work earlier and then idles.
    url: /api/cron/investor-research
    schedule: every 1 hours from 01:00 to 04:00
    timezone: America/Chicago

  - description: >-
      Fill in the profile of every firm still waiting for one — stages, check
      size, verticals, fund details, the investment team — read from the firm's
      own website. After the research runs, so a firm discovered tonight has a
      profile by morning. Best-evidenced firms first, and it stops at the same
      free allowance the research pass does.
    url: /api/cron/enrich-firms
    schedule: every 1 hours from 04:30 to 05:30
    timezone: America/Chicago
